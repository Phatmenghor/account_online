<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CP Bank Verification Code</title>
</head>
<body style="margin:0;padding:0;background-color:#f9fafb;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">

          <tr>
            <td style="padding:0 0 20px;">
              <p style="margin:0;font-size:14px;color:#374151;">Hello,</p>
              <p style="margin:8px 0 0;font-size:14px;color:#6b7280;line-height:1.7;">
                Your CP Bank Account Online verification code is:
              </p>
            </td>
          </tr>

          <!-- OTP -->
          <tr>
            <td align="center" style="padding:8px 0 24px;">
              <p style="margin:0;font-size:40px;font-weight:700;letter-spacing:14px;color:#f97316;font-family:'Courier New',monospace;">[[${otpCode}]]</p>
              <p style="margin:8px 0 0;font-size:12px;color:#9ca3af;">Valid for <strong style="color:#6b7280;">5 minutes</strong></p>
            </td>
          </tr>

          <!-- Note -->
          <tr>
            <td>
              <p style="margin:0;font-size:13px;color:#9ca3af;line-height:1.6;">
                Do not share this code with anyone. If you did not request this, please ignore this email.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
