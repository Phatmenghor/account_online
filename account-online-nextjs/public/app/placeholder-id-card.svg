<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="480" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="stripGrad" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="20" y="16" width="440" height="168" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#fed7aa" stroke-width="1.5"/>

  <!-- Top orange strip -->
  <rect x="20" y="16" width="440" height="10" rx="14" fill="url(#stripGrad)"/>
  <rect x="20" y="20" width="440" height="6" fill="url(#stripGrad)"/>

  <!-- Bottom accent line -->
  <rect x="20" y="172" width="440" height="12" rx="14" fill="#fff7ed"/>
  <rect x="20" y="172" width="440" height="4" fill="#fed7aa"/>

  <!-- Photo placeholder box -->
  <rect x="36" y="38" width="72" height="88" rx="8" fill="url(#photoGrad)" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Person icon -->
  <circle cx="72" cy="64" r="16" fill="#f97316" opacity="0.25"/>
  <circle cx="72" cy="62" r="11" fill="#f97316" opacity="0.5"/>
  <path d="M48 104 Q72 86 96 104" fill="#f97316" opacity="0.4"/>
  <!-- Photo label -->
  <text x="72" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#c2410c" font-weight="600" letter-spacing="0.5">PHOTO</text>

  <!-- Flag / country mark -->
  <rect x="122" y="38" width="32" height="20" rx="3" fill="#f97316" opacity="0.15" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
  <text x="138" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#ea580c" font-weight="700">KH</text>

  <!-- Card title -->
  <text x="163" y="52" font-family="Inter, sans-serif" font-size="11" fill="#9a3412" font-weight="700" letter-spacing="1">NATIONAL IDENTITY CARD</text>

  <!-- Divider -->
  <line x1="122" y1="64" x2="440" y2="64" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Field rows -->
  <!-- Name row -->
  <text x="122" y="82" font-family="Inter, sans-serif" font-size="8" fill="#c2410c" font-weight="600" opacity="0.8">FULL NAME</text>
  <rect x="122" y="87" width="200" height="9" rx="4" fill="#f97316" opacity="0.15"/>

  <!-- ID number row -->
  <text x="122" y="108" font-family="Inter, sans-serif" font-size="8" fill="#c2410c" font-weight="600" opacity="0.8">ID NUMBER</text>
  <rect x="122" y="113" width="140" height="9" rx="4" fill="#f97316" opacity="0.15"/>

  <!-- DOB -->
  <text x="122" y="134" font-family="Inter, sans-serif" font-size="8" fill="#c2410c" font-weight="600" opacity="0.8">DATE OF BIRTH</text>
  <rect x="122" y="139" width="110" height="9" rx="4" fill="#f97316" opacity="0.15"/>

  <!-- Gender -->
  <text x="260" y="134" font-family="Inter, sans-serif" font-size="8" fill="#c2410c" font-weight="600" opacity="0.8">GENDER</text>
  <rect x="260" y="139" width="60" height="9" rx="4" fill="#f97316" opacity="0.15"/>

  <!-- Address -->
  <text x="122" y="160" font-family="Inter, sans-serif" font-size="8" fill="#c2410c" font-weight="600" opacity="0.8">ADDRESS</text>
  <rect x="122" y="165" width="230" height="9" rx="4" fill="#f97316" opacity="0.15"/>

  <!-- Barcode area -->
  <rect x="360" y="110" width="62" height="34" rx="4" fill="#fff" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Barcode lines -->
  <line x1="365" y1="116" x2="365" y2="138" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="368" y1="116" x2="368" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="370" y1="116" x2="370" y2="138" stroke="#ea580c" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="373" y1="116" x2="373" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="375" y1="116" x2="375" y2="138" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="377" y1="116" x2="377" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="380" y1="116" x2="380" y2="138" stroke="#ea580c" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="382" y1="116" x2="382" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="385" y1="116" x2="385" y2="138" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="387" y1="116" x2="387" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="390" y1="116" x2="390" y2="138" stroke="#ea580c" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="393" y1="116" x2="393" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="395" y1="116" x2="395" y2="138" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="397" y1="116" x2="397" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="400" y1="116" x2="400" y2="138" stroke="#ea580c" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="402" y1="116" x2="402" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="405" y1="116" x2="405" y2="138" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="407" y1="116" x2="407" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="410" y1="116" x2="410" y2="138" stroke="#ea580c" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="413" y1="116" x2="413" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="415" y1="116" x2="415" y2="138" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="418" y1="116" x2="418" y2="138" stroke="#ea580c" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Upload hint -->
  <rect x="336" y="150" width="108" height="26" rx="6" fill="#f97316" opacity="0.12"/>
  <text x="390" y="159" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" fill="#c2410c" font-weight="600" opacity="0.9">📷  Tap to Upload</text>
  <text x="390" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="6.5" fill="#ea580c" opacity="0.7">Front side of your NID</text>
</svg>
