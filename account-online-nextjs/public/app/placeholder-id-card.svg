<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fff1e6"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="480" height="210" fill="url(#bg)"/>

  <!-- Card shape centered -->
  <rect x="60" y="28" width="360" height="154" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Orange top bar -->
  <rect x="60" y="28" width="360" height="8" rx="10" fill="#f97316" opacity="0.7"/>
  <rect x="60" y="32" width="360" height="4" fill="#f97316" opacity="0.7"/>

  <!-- Photo box -->
  <rect x="80" y="52" width="64" height="80" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="5 3"/>
  <!-- Person silhouette -->
  <circle cx="112" cy="76" r="16" fill="#f97316" opacity="0.18"/>
  <ellipse cx="112" cy="114" rx="22" ry="14" fill="#f97316" opacity="0.14"/>

  <!-- Country tag -->
  <rect x="160" y="52" width="24" height="14" rx="3" fill="#f97316" opacity="0.15"/>
  <text x="172" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#c2410c">KH</text>

  <!-- Card title -->
  <text x="192" y="62" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#9a3412" letter-spacing="0.8" opacity="0.75">NATIONAL IDENTITY CARD</text>

  <!-- Divider -->
  <line x1="160" y1="72" x2="400" y2="72" stroke="#f97316" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Field: Name -->
  <rect x="160" y="80" width="60" height="6" rx="3" fill="#f97316" opacity="0.12"/>
  <rect x="228" y="80" width="110" height="6" rx="3" fill="#f97316" opacity="0.08"/>

  <!-- Field: ID -->
  <rect x="160" y="96" width="44" height="6" rx="3" fill="#f97316" opacity="0.12"/>
  <rect x="212" y="96" width="80" height="6" rx="3" fill="#f97316" opacity="0.08"/>

  <!-- Field: DOB -->
  <rect x="160" y="112" width="50" height="6" rx="3" fill="#f97316" opacity="0.12"/>
  <rect x="218" y="112" width="68" height="6" rx="3" fill="#f97316" opacity="0.08"/>

  <!-- Field: Address -->
  <rect x="160" y="128" width="200" height="6" rx="3" fill="#f97316" opacity="0.08"/>
  <rect x="160" y="140" width="160" height="6" rx="3" fill="#f97316" opacity="0.06"/>

  <!-- Barcode box -->
  <rect x="350" y="96" width="52" height="48" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="356" y1="103" x2="356" y2="137" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="359" y1="103" x2="359" y2="137" stroke="#c2410c" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="361" y1="103" x2="361" y2="137" stroke="#c2410c" stroke-width="1.6" stroke-opacity="0.4"/>
  <line x1="364" y1="103" x2="364" y2="137" stroke="#c2410c" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="366" y1="103" x2="366" y2="137" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="369" y1="103" x2="369" y2="137" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.4"/>
  <line x1="372" y1="103" x2="372" y2="137" stroke="#c2410c" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="374" y1="103" x2="374" y2="137" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="377" y1="103" x2="377" y2="137" stroke="#c2410c" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="379" y1="103" x2="379" y2="137" stroke="#c2410c" stroke-width="1.6" stroke-opacity="0.4"/>
  <line x1="382" y1="103" x2="382" y2="137" stroke="#c2410c" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="384" y1="103" x2="384" y2="137" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="387" y1="103" x2="387" y2="137" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.4"/>
  <line x1="390" y1="103" x2="390" y2="137" stroke="#c2410c" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="392" y1="103" x2="392" y2="137" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="395" y1="103" x2="395" y2="137" stroke="#c2410c" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="397" y1="103" x2="397" y2="137" stroke="#c2410c" stroke-width="1.6" stroke-opacity="0.4"/>

  <!-- Bottom hint -->
  <text x="240" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c" font-weight="500" opacity="0.6">Tap to upload your National ID Card</text>
</svg>
